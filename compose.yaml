name: dbachum

services:
  mongodb:
    image: mongo:8.0
    restart: unless-stopped
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--eval",
          "quit(db.adminCommand('ping').ok ? 0 : 2)",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - dbachum_internal

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      APP_NAME: DBAChum API
      APP_VERSION: ${APP_VERSION:-2.0.0}
      ENVIRONMENT: production
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      API_V1_PREFIX: /api/v1

      MONGODB_URI: mongodb://mongodb:27017
      MONGODB_DATABASE: ${MONGODB_DATABASE:-dbachum}

      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-dbachum_session}
      SESSION_HOURS: ${SESSION_HOURS:-12}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}

      CONNECTION_ENCRYPTION_KEY: ${CONNECTION_ENCRYPTION_KEY:?Set CONNECTION_ENCRYPTION_KEY in .env}

      METRICS_COLLECTOR_ENABLED: ${METRICS_COLLECTOR_ENABLED:-true}
      METRICS_COLLECTOR_INTERVAL_SECONDS: ${METRICS_COLLECTOR_INTERVAL_SECONDS:-60}
      METRICS_RETENTION_DAYS: ${METRICS_RETENTION_DAYS:-30}

      # Browser traffic normally stays same-origin through Nginx. Keep this
      # configurable for direct API access during controlled deployments.
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=3).read()",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - dbachum_internal

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api/v1
    restart: unless-stopped
    ports:
      - "${DBACHUM_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - dbachum_internal

volumes:
  mongodb_data:

networks:
  dbachum_internal:
    driver: bridge
